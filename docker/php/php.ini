; CryptoNoises container settings.
; VssCfg.php still sets display_errors / error_reporting / time limits per request at runtime.

memory_limit = 512M

display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Media previews and metadata downloads go through the indexer, not through uploads
file_uploads = Off

expose_php = Off

date.timezone = UTC

; Long-running Discord threads and the indexer commands manage their own limits with set_time_limit()
max_execution_time = 30

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
