# CryptoNoises web entry points.
#
# Three listeners, published on different host ports by compose:
#   8080 -> public-api/  Telegram webhooks
#   8081 -> public-app/  short links that redirect to marketplaces
#   8082 -> the media previews built by the indexer (tezos.ipfs_local_base_url)
#
# Put a TLS terminating proxy in front of 8080 and 8081: Telegram only delivers webhooks over HTTPS.

#-----------------------------------------------------------------------------------------------------------------------
# public-api/ : Telegram webhooks
#-----------------------------------------------------------------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    root /opt/cryptonoises/public-api;
    index index.php;

    client_max_body_size 2m;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Same rule as public-api/.htaccess: anything that is not a real file goes to index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.php {
        include        fastcgi_params;
        fastcgi_pass   php:9000;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 60s;
    }

    # index.php is the only entry point: do not execute anything else
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}

#-----------------------------------------------------------------------------------------------------------------------
# public-app/ : marketplace redirects
#-----------------------------------------------------------------------------------------------------------------------
server {
    listen 8081;
    server_name _;

    root /opt/cryptonoises/public-app;
    index index.php;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.php {
        include        fastcgi_params;
        fastcgi_pass   php:9000;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}

#-----------------------------------------------------------------------------------------------------------------------
# Media previews written by the indexer (sync-ipfs jobs)
#
# Static files only; this is what tezos.ipfs_local_base_url has to point at.
#-----------------------------------------------------------------------------------------------------------------------
server {
    listen 8082;
    server_name _;

    root /opt/cryptonoises/external-ipfs;

    access_log off;
    error_log  /dev/stderr;

    location / {
        try_files $uri =404;

        # One Cache-Control header only: `expires` would emit a second, conflicting one.
        # Previews are content-addressed (the path is a hash of the source URI), so they never change.
        add_header Cache-Control "public, max-age=2592000, immutable";

        # Previews are built from untrusted media: never let a browser sniff them into something executable
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'";
    }

    location ~ \.php$ {
        return 404;
    }
}
